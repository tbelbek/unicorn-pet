; Waveshare ESP32-S3-Touch-AMOLED-1.8 (ESP32-S3R8: 8 MB octal PSRAM, 16 MB flash)
;   pio run -d fw              build
;   pio run -d fw -t upload    flash over USB-C
;
; Arduino-ESP32 3.x (pioarduino), as Waveshare's own examples require (ESP_I2S for the codec).
[env:amoled18]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
; Waveshare bundles GFX 1.6.4, which no longer builds on Arduino-ESP32 3.3; 1.6.9 keeps the same SH8601/CO5300 drivers
lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.9
    lewisxhe/XPowersLib @ 0.2.6
    lewisxhe/SensorLib @ 0.3.3
monitor_speed = 115200

<!doctype html>
<!-- The page a parent's phone shows after joining the toy's own WiFi (fw/src/wifi_setup.cpp serves
     it at http://192.168.4.1; tools/embed_portal.py turns it into portal.gen.h). No external files:
     the phone has no internet while it is on the toy's network. Network names are shown with
     textContent only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Unicorn Pet · WiFi</title>
<style>
  :root { color-scheme: dark; --bg: #120d22; --card: #1e1636; --ink: #f4eeff; --dim: #a99bd6;
          --accent: #ffe066; --ok: #5ee07a; --bad: #ff5c6e; --line: #3a2f63; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg);
         color: var(--ink); padding: 18px 16px 40px; max-width: 480px; margin-inline: auto; }
  h1 { font-size: 22px; margin: 4px 0 2px; } h1 span { color: var(--accent); }
  .sub { color: var(--dim); margin: 0 0 18px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 10px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; min-height: 52px;
              padding: 10px 12px; margin: 4px 0; border-radius: 12px; border: 2px solid transparent;
              background: #2a2048; color: var(--ink); font: inherit; }
  li button[aria-pressed="true"] { border-color: var(--accent); }
  .name { flex: 1; overflow-wrap: anywhere; } .meta { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; }
  .bars i { width: 4px; background: var(--line); border-radius: 1px; } .bars i.on { background: var(--ok); }
  label { display: block; color: var(--dim); font-size: 14px; margin: 12px 0 6px; }
  .pw { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: inherit; padding: 12px; border-radius: 12px; border: 2px solid var(--line);
          background: #120d22; color: var(--ink); }
  input:focus { outline: none; border-color: var(--accent); }
  .ghost { font: inherit; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: none; color: var(--ink); }
  .go { width: 100%; margin-top: 14px; min-height: 54px; font: inherit; font-weight: 700; border: 0; border-radius: 14px;
        background: var(--accent); color: #2b1840; }
  .go:disabled { opacity: .45; }
  .hint { color: var(--dim); font-size: 14px; margin: 10px 0 0; }
  .err { color: var(--bad); font-size: 14px; margin: 8px 0 0; min-height: 1em; }
  ol.steps { list-style: none; padding: 0; margin: 0; }
  ol.steps li { display: flex; align-items: center; gap: 10px; padding: 8px 0; color: var(--dim); }
  ol.steps li::before { content: ""; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--line); }
  ol.steps li.now { color: var(--ink); } ol.steps li.now::before { border-color: var(--accent); animation: pulse 1s infinite; }
  ol.steps li.done { color: var(--ink); } ol.steps li.done::before { border-color: var(--ok); background: var(--ok); }
  @keyframes pulse { 50% { opacity: .3; } }
  .result { text-align: center; padding: 8px 0; } .result b { display: block; font-size: 22px; margin: 6px 0; }
  .ok b { color: var(--ok); } .bad b { color: var(--bad); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<h1>🦄 Unicorn Pet <span>WiFi</span></h1>
<p class="sub" data-t="sub"></p>

<section class="card" id="pick">
  <h2 data-t="pick"></h2>
  <ul id="nets"><li class="hint" data-t="loading"></li></ul>
  <p class="hint" data-t="missing"></p>
</section>

<section class="card" id="form" hidden>
  <h2 data-t="pass_h"></h2>
  <div id="chosen" class="name"></div>
  <div id="pwbox">
    <label for="pw" data-t="pass"></label>
    <div class="pw"><input id="pw" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="ghost" id="show" type="button" data-t="show"></button></div>
  </div>
  <p class="err" id="err"></p>
  <button class="go" id="connect" type="button" data-t="connect"></button>
</section>

<section class="card" id="progress" hidden>
  <h2 data-t="progress"></h2>
  <ol class="steps"><li id="s0" data-t="s0"></li><li id="s1" data-t="s1"></li><li id="s2" data-t="s2"></li></ol>
  <p class="hint" id="note" data-t="note"></p>
</section>

<section class="card result" id="done" hidden>
  <div id="icon" style="font-size:44px"></div><b id="title"></b><p id="msg" class="hint"></p>
  <button class="go" id="again" type="button" hidden data-t="again"></button>
</section>

const lang = (navigator.languages || [navigator.language || "en"]).map((l) => l.slice(0, 2).toLowerCase())
  .find((l) => WORDS.sub && WORDS.sub[l]) || "en";
const t = (key) => (WORDS[key] && (WORDS[key][lang] || WORDS[key].en)) || key;
document.documentElement.lang = lang;
for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
let chosen = null, polling = null, unsure = false, misses = 0;

function bars(rssi) {
  const n = rssi > -55 ? 4 : rssi > -67 ? 3 : rssi > -78 ? 2 : 1, b = document.createElement("span");
  b.className = "bars";
  for (let i = 0; i < 4; i++) { const s = document.createElement("i"); s.style.height = 4 + i * 4 + "px"; if (i < n) s.className = "on"; b.append(s); }
  return b;
}

function show(list) {
  const ul = $("nets");
  ul.textContent = "";
  if (!list.length) { const li = document.createElement("li"); li.className = "hint"; li.textContent = t("none"); ul.append(li); return; }
  for (const n of list) {
    const li = document.createElement("li"), b = document.createElement("button"), name = document.createElement("span"),
          meta = document.createElement("span");
    name.className = "name"; name.textContent = n.s;
    meta.className = "meta"; meta.textContent = n.l ? "🔒" : t("open");
    b.type = "button"; b.append(name, meta, bars(n.r)); b.setAttribute("aria-pressed", "false");
    b.onclick = () => {
      chosen = n;
      for (const x of ul.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
      $("chosen").textContent = n.s;
      $("pwbox").hidden = !n.l;
      $("form").hidden = false;
      $("err").textContent = "";
      if (n.l) $("pw").focus();
    };
    li.append(b); ul.append(li);
  }
}

function valid(pass) {           // WPA: 8-63 characters, or 64 hex digits
  return !chosen.l || (pass.length >= 8 && pass.length <= 63) || /^[0-9a-fA-F]{64}$/.test(pass);
}

const STAGES = { join: 0, addr: 1, clock: 2 };
const RESULTS = {                // icon, then the title and message keys; true = it worked
  ok: ["✅", true], noclock: ["🕒", true], badpass: ["❌", false], notfound: ["❌", false],
  full: ["📋", false], timeout: ["⏱️", false],
};

function stage(st) {
  if (st.stage in STAGES) {
    $("pick").hidden = $("form").hidden = $("done").hidden = true;
    $("progress").hidden = false;
    for (let i = 0; i < 3; i++) $("s" + i).className = i < STAGES[st.stage] ? "done" : i === STAGES[st.stage] ? "now" : "";
    return false;
  }
  const r = RESULTS[st.stage];
  if (!r) return false;
  $("progress").hidden = true;
  $("done").hidden = false;
  $("done").className = "card result " + (r[1] ? "ok" : "bad");
  $("icon").textContent = r[0]; $("title").textContent = t(st.stage + "_t"); $("msg").textContent = t(st.stage + "_m");
  $("again").hidden = r[1] || st.stage === "timeout";
  return true;
}

function back_to_form(msg) {               // the attempt never started (or the toy is gone): try again
  clearInterval(polling);
  $("progress").hidden = $("done").hidden = true;
  $("pick").hidden = $("form").hidden = false;
  $("connect").disabled = false;
  $("err").textContent = msg;
}

function poll() {
  clearInterval(polling);
  misses = 0;
  polling = setInterval(() => {
    api.status().then((st) => {
      misses = 0;
      $("note").textContent = t("note");
      if (st.stage === "wait" && unsure) { unsure = false; back_to_form(t("e_retry")); return; }   // the POST was lost
      if (stage(st)) clearInterval(polling);
    }).catch(() => {
      $("note").textContent = t("reconnect");
      if (++misses >= 40) back_to_form(t("e_lost"));   // 40 s without the toy: its network may be gone
    });
  }, 1000);
}

$("show").onclick = () => { const p = $("pw"); p.type = p.type === "password" ? "text" : "password"; $("show").textContent = t(p.type === "password" ? "show" : "hide"); };
$("connect").onclick = () => {
  const pass = $("pw").value;
  if (!chosen) return;
  if (!valid(pass)) { $("err").textContent = t("e_len"); return; }
  $("connect").disabled = true;
  api.connect(chosen, chosen.l ? pass : "").then((r) => {
    $("connect").disabled = false;
    if (r && r.error) { $("err").textContent = t("e_" + r.error); return; }
    unsure = false;
    stage({ stage: "join" }); poll();
  }).catch(() => { $("connect").disabled = false; unsure = true; stage({ stage: "join" }); poll(); });
};
$("again").onclick = () => { $("done").hidden = true; $("pick").hidden = $("form").hidden = false; $("connect").disabled = false; };
api.scan().then(show).catch(() => { $("nets").textContent = t("e_list"); });
</script>
